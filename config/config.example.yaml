# statehouse local configuration.
#
# This file holds only what this host needs to start and to reach everything
# else: site, mqtt, identity, remote_config, http, auth, recent_log and influx.
#
# Everything else comes only from the config service (remote_config.base_url),
# never from this file:
#
#   adapters, energy, availability, house   statehouse_behaviour
#   device_classes                          statehouse_classes
#   devices                                 the site's devices namespace
#
# statehouse refuses to start if this file sets any of those, or if the config
# service cannot be reached. See docs/remote-config.md, and config/remote/ for
# example namespace documents.

# The property this instance serves.
#
#   id                 must match an id in the `sites` namespace. Supplies the `site`
#                      tag on every Influx point, which is what keeps device ids
#                      unambiguous once a second site reports into the same bucket.
#   devices_namespace  the config namespace holding this site's devices. Required,
#                      with no default: the shared namespace it used to fall back to
#                      has been deleted, and a failed devices fetch is silent — the
#                      service would start, report healthy and serve no devices.
#
# Both are required; statehouse refuses to start without them. `site: home` still
# parses as `site: {id: home}`, but names no namespace, so it is not startable alone.
site:
  id: home
  devices_namespace: devices_home

mqtt:
  broker: tcp://localhost:1883
  client_id: statehouse
  publish_prefix: house

# Credentials statehouse uses to call out: a client_credentials client at the
# identity service, used for the Bearer token sent to the config service.
# Required. (auth, below, is the other direction: tokens coming in.)
identity:
  base_url: https://id.example.net
  client_id: statehouse
  client_secret: change-me

# The config service holding statehouse_behaviour, statehouse_classes and the
# site's devices namespace. Required: there is no local mode. Read at startup
# and again on SIGHUP; a failed read at startup stops the service, and a failed
# SIGHUP reload keeps the running config.
remote_config:
  base_url: https://config.example.net

http:
  listen: :8383
  # Externally-reachable base URL. Substituted into the `servers` list of the
  # OpenAPI document served at /openapi.json, so a generated client points at
  # the real host rather than a placeholder.
  # public_url: https://statehouse.example.net

  # Browser origins permitted to read this API cross-origin.
  #
  # Empty (or absent) means none: no Access-Control-* headers on any
  # allowlisted route, which is how the service behaved before CORS existed.
  # Turning it on is an explicit act.
  #
  # Forms:
  #   https://app.swee.net   one origin exactly
  #   https://*.swee.net     any subdomain of swee.net — but NOT swee.net
  #                          itself, which is listed separately if wanted
  #   http://localhost:*     any port on that host, including none
  #   *                      every origin, as a flat wildcard
  #
  # This is not access control. It tells a browser which pages may read a
  # response with JavaScript; the Bearer token is what protects the API, and
  # anything that is not a browser ignores it. What the allowlist buys is that
  # a page on some other origin cannot spend a token the browser already holds.
  #
  # A malformed entry is refused at startup rather than skipped, because a
  # skipped entry fails silently in both directions.
  #
  # GET /healthz and GET /openapi.json are exempt and always answer "*": both
  # are unauthenticated, so they are already world-readable, and a Swagger or
  # Redoc viewer on an arbitrary origin has to be able to fetch the spec.
  #
  # Left commented out on purpose. "http://localhost:*" is meaningful on every
  # deployment, so shipping it live would grant every locally-served page, on
  # any port, the ability to read the API with a token the browser already
  # holds — inherited by anyone who copies this file, without the explicit act
  # promised three paragraphs up. Uncomment what you actually want.
  #
  # allowed_origins:
  #   - "https://*.swee.net"
  #   - "http://localhost:*"   # development

# Credentials this service uses to call *out* — today, to fetch remote config.
# Setting identity.base_url also switches on inbound authentication: every
# endpoint except /healthz and /openapi.json then requires a Bearer JWT signed
# by this issuer. Leave it unset for local development and the API is open.
# identity:
#   base_url: https://id.example.net
#   client_id: statehouse
#   client_secret: <from the identity service>

# remote_config:
#   base_url: https://config.example.net

# How callers authenticate *in*. See docs/service-tokens.md.
auth:
  service_tokens:
    # Accept tokens from services using the client_credentials grant, not just
    # user tokens from the UI. Absent means true. Set false to refuse them.
    enabled: true

    # Optional hardening; each is unenforced when empty, which is the default.
    #
    #   required_audience  require the token's `aud` to name this server, so a
    #                      token minted for a sibling service is not accepted
    #                      here. Set this once identity stamps an audience.
    #   required_scope     require one scope, matched whole against the token's
    #                      space-delimited `scope` claim.
    #   allowed_clients    permit only these client_ids, matched exactly. The
    #                      one restriction that needs nothing new from the
    #                      identity service.
    #
    # required_audience: https://statehouse.example.net
    # required_scope: statehouse:read
    # allowed_clients:
    #   - countinghouse
    #   - greenhouse

recent_log:
  path: /var/lib/statehouse/events.jsonl
  retention_hours: 72
  max_size_mb: 256

influx:
  enabled: false
  url: http://localhost:8086
  org: home
  bucket: house
  token_file: /etc/statehouse/influx-token

